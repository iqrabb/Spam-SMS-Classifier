<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpamCheck AI — Detect Spam SMS Instantly</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #121417;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 650px;

            background: #1c1f24;

            padding: clamp(22px, 5vw, 40px);

            border-radius: 20px;

            border: 1px solid #2b2f36;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.4);
        }


        h1 {

            text-align: center;

            color: #f4f6f8;

            font-size: clamp(20px, 5vw, 26px);

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #9aa3ad;

            font-size: clamp(13px, 3vw, 15px);

            margin-bottom: 30px;

            line-height: 1.5;
        }


        textarea {

            width: 100%;

            height: 150px;

            resize: none;

            padding: 15px;

            border: 2px solid #2b2f36;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            background: #14161a;

            color: #e6e9ec;
        }


        textarea::placeholder {

            color: #626a73;
        }


        textarea:focus {

            border-color: #10b981;
        }


        button {

            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #10b981;

            color: #0b0d10;

            font-size: clamp(15px, 4vw, 17px);

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #0ea371;
        }


        #result {

            margin-top: 30px;

            display: none;

            padding: clamp(18px, 4vw, 25px);

            border-radius: 15px;

            background: #14161a;

            border: 1px solid #2b2f36;
        }


        .result-title {

            text-align: center;

            font-size: clamp(19px, 5vw, 24px);

            margin-bottom: 20px;
        }


        .spam {

            color: #f87171;
        }


        .not-spam {

            color: #10b981;
        }


        .probability {

            margin-top: 15px;
        }


        .probability-row {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 8px;

            font-size: clamp(13px, 3.5vw, 15px);

            color: #c3c9cf;
        }


        .bar-container {

            width: 100%;

            height: 12px;

            background: #2b2f36;

            border-radius: 10px;

            overflow: hidden;

            margin-bottom: 15px;
        }


        .bar {

            height: 100%;

            width: 0%;

            border-radius: 10px;

            transition: width 0.5s ease;
        }


        .spam-bar {

            background: #f87171;
        }


        .not-spam-bar {

            background: #10b981;
        }


        .loading {

            text-align: center;

            color: #9aa3ad;

            margin-top: 20px;

            display: none;
        }


        /* Tablet and small screens */

        @media (max-width: 600px) {

            body {

                padding: 12px;

                align-items: flex-start;
            }


            .container {

                border-radius: 16px;

                margin-top: 20px;
            }


            textarea {

                height: 130px;
            }

        }


        /* Small phones */

        @media (max-width: 360px) {

            .container {

                padding: 18px 14px;
            }


            .probability-row {

                flex-direction: column;

                gap: 2px;

                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>🛡️ Spam SMS Classifier </h1>


    <p class="subtitle">

        Paste any SMS text below — our machine learning model
        instantly checks it and tells you whether it's spam or safe.

    </p>


    <textarea
        id="message"
        placeholder="Example: Congratulations! You have won a free prize..."
    ></textarea>


    <button onclick="predictSpam()">

        🔍 Check Message

    </button>


    <div class="loading" id="loading">

        Checking message...

    </div>


    <div id="result">


        <div
            id="resultTitle"
            class="result-title">
        </div>


        <div class="probability">


            <div class="probability-row">

                <span>
                    🚨 Spam Probability
                </span>

                <strong id="spamProbability">
                    0%
                </strong>

            </div>


            <div class="bar-container">

                <div
                    id="spamBar"
                    class="bar spam-bar">
                </div>

            </div>


            <div class="probability-row">

                <span>
                    ✅ Not Spam Probability
                </span>

                <strong id="notSpamProbability">
                    0%
                </strong>

            </div>


            <div class="bar-container">

                <div
                    id="notSpamBar"
                    class="bar not-spam-bar">
                </div>

            </div>


        </div>


    </div>


</div>


<script>


async function predictSpam() {


    const message =
        document.getElementById("message").value;


    // Empty message check

    if (message.trim() === "") {

        alert("Please enter an SMS message.");

        return;
    }


    // Show loading

    document.getElementById("loading").style.display =
        "block";

    document.getElementById("result").style.display =
        "none";


    // Create form data

    const formData =
        new URLSearchParams();

    formData.append(
        "message",
        message
    );


    try {


        // Send request to FastAPI

        const response =
            await fetch("/predict", {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/x-www-form-urlencoded"

                },

                body: formData

            });


        const data =
            await response.json();


        // Hide loading

        document.getElementById("loading").style.display =
            "none";


        // Show result

        document.getElementById("result").style.display =
            "block";


        // Get elements

        const resultTitle =
            document.getElementById("resultTitle");


        const spamProbability =
            document.getElementById("spamProbability");


        const notSpamProbability =
            document.getElementById("notSpamProbability");


        const spamBar =
            document.getElementById("spamBar");


        const notSpamBar =
            document.getElementById("notSpamBar");


        // Display probabilities

        spamProbability.innerText =
            data.spam_probability + "%";


        notSpamProbability.innerText =
            data.not_spam_probability + "%";


        spamBar.style.width =
            data.spam_probability + "%";


        notSpamBar.style.width =
            data.not_spam_probability + "%";


        // Display prediction

        if (data.prediction === "Spam") {


            resultTitle.innerText =
                "🚨 SPAM MESSAGE";


            resultTitle.className =
                "result-title spam";


        } else {


            resultTitle.innerText =
                "✅ NOT SPAM";


            resultTitle.className =
                "result-title not-spam";

        }


    } catch (error) {


        document.getElementById("loading").style.display =
            "none";


        alert(
            "Something went wrong. Please try again."
        );


        console.error(error);

    }

}

</script>


</body>

</html>
